name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Select test suite
        required: true
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: test:e2e
      browser:
        description: Select browser
        required: true
        type: choice
        options:
          - chromium
        default: chromium
      mode:
        description: Run mode
        required: true
        type: choice
        options:
          - headless
          - headed
        default: headless

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    env:
      CI: "1"
      WEB_APP_URL: https://tutorialsninja.com/demo/
      API_BASE_URL: https://fakestoreapi.com
      APP_ENV: github-actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright tests
        shell: pwsh
        env:
          TEST_SUITE: ${{ github.event.inputs.test_suite || 'test:e2e' }}
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
          MODE: ${{ github.event.inputs.mode || 'headless' }}
        run: |
          $suitePatterns = @{
            'test:master' = '@master'
            'test:sanity' = '@sanity'
            'test:regression' = '@regression'
            'test:e2e' = '@end-to-end'
            'test:api' = '@api'
            'test:web' = '@web'
            'test:datadriven' = '@datadriven'
          }

          if (-not $suitePatterns.ContainsKey($env:TEST_SUITE)) {
            throw "Unsupported test suite: $env:TEST_SUITE"
          }

          $env:ALLURE_RESULTS_DIR = switch ($env:TEST_SUITE) {
            'test:web' { 'allure-results/ui' }
            'test:api' { 'allure-results/api' }
            'test:e2e' { 'allure-results/ui' }
            'test:datadriven' { 'allure-results/ui' }
            default { 'allure-results' }
          }

          $playwrightArgs = @(
            '--grep', $suitePatterns[$env:TEST_SUITE],
            "--project=$env:BROWSER",
            '--output=test-results'
          )

          if ($env:MODE -eq 'headed') {
            $playwrightArgs += '--headed'
          }

          npx playwright test @playwrightArgs
          exit $LASTEXITCODE

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30
